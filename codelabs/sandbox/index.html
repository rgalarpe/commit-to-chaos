<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codelab Sandbox</title>
  <style>
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f5f7fa;
      color: #1e293b;
    }
    main {
      background: white;
      padding: 2rem 2.5rem;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.05);
      text-align: center;
    }
    h1 {
      font-weight: 500;
      font-size: 1.8rem;
      margin-top: 0;
      margin-bottom: 0.5rem;
    }
    p {
      color: #475569;
      margin-bottom: 0;
    }
    #output {
      margin-top: 1.5rem;
      font-family: 'SF Mono', 'Fira Code', monospace;
      background: #f1f5f9;
      padding: 0.75rem 1.25rem;
      border-radius: 40px;
      display: inline-block;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>🧪 Codelab Sandbox</h1>
    <p>JavaScript is enabled and ready for testing.</p>
    <div id="output">⏳ waiting for script…</div>
  </main>

  <script>
  function add(a, b) { return a + b; }
  console.log(add(2, 3));           // 5
  document.getElementById('output').textContent = add(10, 20);
  </script>

</body>
</html>
